name: dssetl

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
    - geo/.env
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (audit L-3/M-3)}@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY must be set in .env (audit L-3/M-3)}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?AIRFLOW__WEBSERVER__SECRET_KEY must be set in .env (audit L-3/M-3)}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./etl:/opt/airflow/etl
    - ./artifacts:/opt/airflow/artifacts
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: dssetl-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dssetl-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (audit L-3/M-3)}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (audit L-3/M-3)}", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: dssetl-airflow-init
    command: bash -c "airflow db migrate && airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD must be set in .env (audit L-3/M-3)} --firstname Admin --lastname Admin --role Admin --email admin@dwh.kz"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: dssetl-airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: dssetl-airflow-scheduler
    command: scheduler
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    container_name: dssetl-airflow-worker
    command: celery worker
    restart: unless-stopped

  fastapi:
    build: ./app
    container_name: dssetl-fastapi
    env_file:
      - .env
      - geo/.env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./app:/app
      - ./artifacts:/app/artifacts
      - ./etl:/app/etl
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - default
      - proxy-net

  postgis-agromap:
    image: postgis/postgis:15-3.4
    container_name: dssetl-postgis-agromap
    env_file: geo/postgres_init.env
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=256MB -c max_connections=50
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgis_agromap_data:/var/lib/postgresql/data
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  postgis_agromap_data:

networks:
  proxy-net:
    external: true
