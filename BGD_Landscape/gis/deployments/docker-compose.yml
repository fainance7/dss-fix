x-app-common: &app-common
  build:
    context: ..
    dockerfile: build/package/Dockerfile
  environment: &app-environment
    PORT: 8080
    DB_URL: postgres://gis:***@postgres:5432/gis?sslmode=disable
    S3_ENDPOINT: minio:9000
    # CREDENTIAL ROTATION (audit C-2): local-dev defaults only — override with
    # strong values for any shared/production deployment (minioadmin/minioadmin
    # is a well-known default and must never leave this file's dev context).
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:***
    S3_SECRET_KEY: ${S3_SECRET_KEY:***
    S3_BUCKET: geofiles
    S3_USE_SSL: "false"
    RABBITMQ_URL: amqp://guest:***@rabbitmq:5672/
    RABBITMQ_EXCHANGE: gis.events
    RABBITMQ_QUEUE: gis.events.example
    # API auth (audit C-2): set to a long random string (>=32 chars) in any
    # shared/production deployment; empty disables auth (local dev only).
    API_KEY: ${API_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app-common
    command: ["serve"]
    ports:
      - "8080:8080"
    volumes:
      - ../stubs:/stubs
    depends_on:
      - postgres
      - minio
      - rabbitmq

  worker:
    <<: *app-common
    command: ["worker"]
    depends_on:
      - postgres
      - minio
      - rabbitmq

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
      POSTGRES_DB: gis
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Local-dev defaults only (audit C-2) — override MINIO_ROOT_USER/
      # MINIO_ROOT_PASSWORD with strong values before any shared deployment.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:***
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:***
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Local-dev defaults only (audit C-2) — override RABBITMQ_DEFAULT_USER/
      # RABBITMQ_DEFAULT_PASS with strong values before any shared deployment.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:***
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:***
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
