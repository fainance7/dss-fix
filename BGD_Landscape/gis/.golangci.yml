run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose

issues:
  exclude-rules:
    # Test stubs intentionally ignore some interface parameters.
    - path: _test\.go
      linters:
        - errcheck
