x-app-common: &app-common
  build:
    context: ..
    dockerfile: build/package/Dockerfile
  environment: &app-environment
    PORT: 8080
    DB_URL: postgres://gis:${GIS_DB_PASSWORD:?GIS_DB_PASSWORD must be set in deployments/.env (audit C-2)}@postgres:5432/gis?sslmode=disable
    S3_ENDPOINT: minio:9000
    # Secrets (audit C-2/L-1): no defaults — compose refuses to start until they
    # are set in deployments/.env (see deployments/.env.example).
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in deployments/.env (audit C-2/L-1)}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in deployments/.env (audit C-2/L-1)}
    S3_BUCKET: geofiles
    S3_USE_SSL: "false"
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}@rabbitmq:5672/
    RABBITMQ_EXCHANGE: gis.events
    RABBITMQ_QUEUE: gis.events.example
    # API auth (audit C-2): required, >=32 chars. API_AUTH_DISABLED=true is for
    # a developer laptop only and is logged as a warning at startup.
    API_KEY: ${API_KEY:?API_KEY must be set (>=32 chars, audit C-2)}
    API_AUTH_DISABLED: ${API_AUTH_DISABLED:-false}
    # API documentation (/docs, /openapi.yaml) without a key — off by default (Этап 7).
    API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    # Largest raster accepted for processing, width×height (Этап 7).
    GIS_RASTER_MAX_PIXELS: ${GIS_RASTER_MAX_PIXELS:-1000000000}
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  # Memory cap per container (Этап 7): a hostile file must not take the host.
  mem_limit: ${GIS_MEM_LIMIT:-2g}
  restart: unless-stopped

services:
  app:
    <<: *app-common
    command: ["serve"]
    ports:
      - "8080:8080"
    volumes:
      - ../stubs:/stubs
    depends_on:
      - postgres
      - minio
      - rabbitmq

  worker:
    <<: *app-common
    command: ["worker"]
    depends_on:
      - postgres
      - minio
      - rabbitmq

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: ${GIS_DB_PASSWORD:?GIS_DB_PASSWORD must be set in deployments/.env (audit C-2)}
      POSTGRES_DB: gis
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Root credentials = the app's S3 keys; no defaults (audit C-2/L-1).
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set (audit C-2/L-1)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set (audit C-2/L-1)}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      # No default credentials (audit C-2). Ports bound to 127.0.0.1 only.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set (audit C-2)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set (audit C-2)}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
